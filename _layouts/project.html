---
layout: default
---

<style>
  /* Align bottom section with project content */
  .project-bottom {
    width: 85vw;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 0 40px;
    text-align: left;
    box-sizing: border-box;
  }

  .project-bottom .back-arrow {
    display: inline-block;
  }

  @media (max-width: 700px) {
    .project-bottom {
      width: calc(100% - 36px);
    }
  }
</style>

{% if page.image %}
  <p>
    <img
      src="{{ page.image | relative_url }}"
      alt="{{ page.imagealt | default: page.title }}"
    >
  </p>
{% endif %}

{{ content }}

<div class="project-bottom">

  {% if page.technologies %}
    <p>
      <strong>Technologies Used</strong>:
      {{ page.technologies | join: ", " }}
    </p>
  {% endif %}

  <a href="{{ '/projects/' | relative_url }}" class="back-arrow">
    <i class="bi bi-arrow-left-circle-fill"></i>
    Back to Projects
  </a>

</div>
